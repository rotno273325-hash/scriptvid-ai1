<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDL অ্যাডমিন</title><style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#1d1d22;--mu:#6b6b76;--br:#e4e4ea;--pr:#f85606;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c20;--tx:#f2f2f5;--mu:#9a9aa6;--br:#2c2c33;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#f85606,#ff8a3d);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{font-weight:800;color:#fff;font-size:20px;white-space:nowrap}
.sr{flex:1;min-width:0;border:0;border-radius:8px;padding:9px 12px;background:#fff;color:#222}
.ib{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.ban{border-radius:14px;padding:22px 18px;background:linear-gradient(120deg,#6d28d9,#f85606);color:#fff;margin-bottom:12px}
.ban h2{margin:0 0 4px}.ban p{margin:0;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--br);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pi{font-size:60px;text-align:center;padding:16px 0;background:var(--bg);position:relative}
.dc{position:absolute;top:8px;left:8px;background:var(--pr);color:#fff;font-size:12px;padding:1px 7px;border-radius:6px}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.pn{font-size:14px;min-height:42px}
.pp{color:var(--pr);font-weight:700;font-size:17px}.po{color:var(--mu);text-decoration:line-through;font-size:12px;margin-left:6px;font-weight:400}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--br)}.btn.r{background:#dc2626}.btn:disabled{opacity:.5}
.dr{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;justify-content:flex-end}.dr.on{display:flex}
.dp{background:var(--card);width:min(420px,100%);height:100%;overflow:auto;padding:16px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--br)}.ci .t{flex:1;font-size:14px}
.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--br);background:var(--bg);cursor:pointer}
.in{width:100%;padding:9px 10px;margin:4px 0 8px;border:1px solid var(--br);border-radius:8px;background:var(--bg)}
label{font-size:13px;color:var(--mu)}.box{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.st div{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px}.st b{display:block;font-size:22px;color:var(--pr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}
.msg{font-size:13px;margin-top:8px;color:var(--mu)}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.pi img{width:100%;height:150px;object-fit:cover;display:block}.pi{cursor:pointer;padding:0;height:150px;display:flex;align-items:center;justify-content:center}
.pi.em{font-size:60px}.av{width:22px;height:22px;border-radius:50%;vertical-align:middle}
.hrt{position:absolute;top:6px;right:8px;background:var(--card);border-radius:50%;width:30px;height:30px;border:0;cursor:pointer;font-size:16px}
.dp{position:relative}.x{position:absolute;top:10px;right:10px}.dp h3{margin-top:0;padding-right:44px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:#fde68a;color:#78350f}
.badge.s1{background:#bfdbfe;color:#1e3a8a}.badge.s2{background:#ddd6fe;color:#4c1d95}.badge.s3{background:#bbf7d0;color:#14532d}.badge.s4{background:#fecaca;color:#7f1d1d}
.sel{padding:7px 10px;border:1px solid var(--br);border-radius:8px;background:var(--card)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:3px 0}.tot{font-size:18px;font-weight:700;border-top:1px dashed var(--br);margin-top:6px;padding-top:8px}
.big{width:100%;height:220px;object-fit:cover;border-radius:12px;background:var(--bg)}.bigem{font-size:110px;text-align:center;background:var(--bg);border-radius:12px;padding:20px}
.star{color:#f59e0b}.ord{border:1px solid var(--br);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.tm{font-weight:700;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:6px;margin-left:6px}
</style></head><body><div id="app"></div>
<script>
let D=null,tab="d",PW=sessionStorage.getItem("pw")||"",IMGS=[],RV=0;
const $=i=>document.getElementById(i),bn=n=>"৳"+Number(n).toLocaleString("bn-BD"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=(p,m,b)=>fetch("/api/admin/"+p,{method:m||"GET",headers:{"x-admin":PW,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"সমস্যা");e.s=r.status;throw e}return j});
function load(){return api("data").then(d=>{D=d;render()}).catch(e=>login(e.s===429?e.message:""))}
function login(m){$("app").innerHTML=`<div class="wrap" style="max-width:380px;margin-top:60px"><div class="box"><h2 style="margin-top:0">🔐 RDL অ্যাডমিন</h2><label>পাসওয়ার্ড</label><input class="in" type="password" id="pw" onkeydown="if(event.key==='Enter')go()"><button class="btn" style="width:100%" onclick="go()">লগইন</button><div class="msg">${esc(m||"")}</div></div></div>`}
function go(){PW=$("pw").value;sessionStorage.setItem("pw",PW);api("data").then(d=>{D=d;render()}).catch(e=>login(e.s===429?e.message:"ভুল পাসওয়ার্ড।"))}
const SS=["পেমেন্ট যাচাই বাকি","পেন্ডিং","প্রসেসিং","শিপড","ডেলিভারড","বাতিল"];
function render(){const T=[["d","ড্যাশবোর্ড"],["p","পণ্য"],["o","অর্ডার"],["u","ইউজার"],["c","কুপন"],["s","API সিঙ্ক"],["b","ব্যাকআপ"],["t","সাপোর্ট"],["g","সেটিংস"],["r","রিভিউ"],["n","ব্যানার"],["m","রিসেলার"]];
let h=`<div class="hd"><span class="logo">RDL অ্যাডমিন</span><span style="flex:1"></span><a class="ib" href="/" target="_blank" style="text-decoration:none">শপ</a><button class="ib" onclick="sessionStorage.clear();PW='';login()">লগআউট</button></div><div class="wrap"><div class="chips">${T.map(t=>`<button class="chip${tab===t[0]?" on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`;
h+=D.db?`<div class="box" style="border-color:${D.db.ok?"#16a34a":"#dc2626"}">${D.db.ok?"✅ ডেটাবেস সংযুক্ত, ডেটা সেভ হচ্ছে":"❌ ডেটা স্থায়ীভাবে সেভ হচ্ছে না: "+esc(D.db.msg)} <button class="btn g" onclick="dbt()">পরীক্ষা করুন</button></div>`:"";
if(tab==="d"){const ok=D.orders.filter(o=>o.status!=="বাতিল"),rev=ok.reduce((s,o)=>s+o.total,0);h+=`<div class="st"><div>পণ্য<b>${D.products.length}</b></div><div>ইউজার<b>${D.users.length}</b></div><div>অর্ডার<b>${D.orders.length}</b></div><div>পেন্ডিং<b>${D.orders.filter(o=>o.status==="পেন্ডিং").length}</b></div><div>বিক্রি<b>${bn(rev)}</b></div><div>কম স্টক<b>${D.products.filter(p=>p.stock<10).length}</b></div></div>`}
if(tab==="p")h+=`<div class="box"><h3 style="margin-top:0" id="ft">নতুন পণ্য যোগ করুন</h3><input type="hidden" id="pid"><div class="f2"><div><label>নাম</label><input class="in" id="pn"></div><div><label>ক্যাটাগরি</label><input class="in" id="pc"></div><div><label>দাম (৳)</label><input class="in" id="pr" type="number"></div><div><label>আগের দাম (৳)</label><input class="in" id="po" type="number"></div><div><label>স্টক</label><input class="in" id="ps" type="number"></div><div><label>ইমোজি (ছবি না থাকলে)</label><input class="in" id="pe" value="📦"></div></div><label>বিবরণ</label><input class="in" id="pd"><label>পণ্যের ছবি (সর্বোচ্চ ৫টি)</label><input class="in" type="file" accept="image/*" multiple onchange="pick(this)"><div id="ims" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div><label>ভিডিও লিংক (YouTube / Facebook / mp4, ঐচ্ছিক)</label><input class="in" id="pv"><div class="f2"><div><label>ধরন</label><select class="in" id="pt"><option value="normal">সাধারণ পণ্য</option><option value="mystery">🎁 মিস্ট্রি বক্স</option></select></div><div><label>কেনা দাম (শুধু আপনি দেখবেন)</label><input class="in" id="pk" type="number"></div><div><label>🤝 রিসেলার দাম (ফাঁকা = রিসেলারদের জন্য বন্ধ)</label><input class="in" id="pk2" type="number"></div></div><label><input type="checkbox" id="pf"> ⭐ বিশেষ পণ্য হিসেবে সামনে দেখান</label><br><button class="btn" onclick="sp()">সেভ করুন</button> <button class="btn g" onclick="IMGS=[];render()">রিসেট</button><div class="msg" id="pmsg"></div></div>
<div class="box tw"><table><tr><th></th><th>নাম</th><th>ক্যাটাগরি</th><th>দাম / লাভ</th><th>স্টক</th><th>👁 🛒 ✅</th><th></th></tr>${D.products.map(p=>`<tr><td>${p.imgs[0]?`<img src="${esc(p.imgs[0])}" width="36" height="36" style="object-fit:cover;border-radius:6px">`:esc(p.em)}</td><td>${esc(p.name)}${p.type==="mystery"?" 🎁":""}${p.featured?" ⭐":""}</td><td>${esc(p.cat)}</td><td>${bn(p.price)}${p.rp?`<br><span class="msg">রিসেলার ${bn(p.rp)}</span>`:""}${p.cost?`<br><span class="msg">লাভ ${bn(p.price-p.cost)}</span>`:""}</td><td>${p.stock}</td><td>${p.views||0} · ${p.carts||0} · ${p.sold||0}</td><td><button class="btn g" onclick="ep(${p.id})">এডিট</button> <button class="btn g" onclick="cpl(${p.id})">🔗</button> <button class="btn r" onclick="dp(${p.id})">মুছুন</button></td></tr>`).join("")}</table></div>`;
if(tab==="o")h+=`<div class="box tw">${D.orders.length?`<table><tr><th>#</th><th>গ্রাহক</th><th>ইমেইল</th><th>ফোন</th><th>ঠিকানা</th><th>পণ্য</th><th>মোট</th><th>স্ট্যাটাস</th></tr>${D.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}${o.rs?`<br><span class="badge s2">রিসেলার: ${esc(o.rs.shop||"")}</span><br>লাভ ${bn(o.rs.profit)}`:""}</td><td>${esc(o.email)}</td><td>${esc(o.phone)}</td><td>${esc([o.district,o.thana,o.addr].filter(Boolean).join(", "))}</td><td>${o.items.map(i=>esc(i.name)+" ×"+i.n).join(", ")}</td><td>${bn(o.total)}${o.pay==="bkash"?`<br>📲 ${bn(o.adv||0)} · ${esc(o.trx)}<br>${esc(o.sender)}<br><button class="btn ${o.paid?"g":""}" onclick="pd(${o.id},${!o.paid})">${o.paid?"✅ যাচাইকৃত":"✔ যাচাই করে কনফার্ম করুন"}</button>`:""}</td><td><select class="in" style="margin:0" onchange="os(${o.id},this.value)">${SS.map(s=>`<option${s===o.status?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table>`:"কোনো অর্ডার নেই।"}</div>`;
if(tab==="u")h+=`<div class="box tw">${D.users.length?`<table><tr><th>নাম</th><th>ইমেইল</th><th>ফোন</th><th>অর্ডার</th></tr>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${D.orders.filter(o=>o.email===u.email).length}</td></tr>`).join("")}</table>`:"কোনো ইউজার নেই।"}</div>`;
if(tab==="c")h+=`<div class="box"><h3 style="margin-top:0">কুপন</h3>${D.coupons.map((c,i)=>`<div class="row"><span><b>${esc(c.code)}</b> · ${c.type==="pct"?c.val+"%":bn(c.val)} ছাড় · সর্বনিম্ন ${bn(c.min)} ${c.active?"":"(বন্ধ)"}</span><span><button class="btn g" onclick="tg(${i})">${c.active?"বন্ধ":"চালু"}</button> <button class="btn r" onclick="dc(${i})">✕</button></span></div>`).join("")}
<div class="f2" style="margin-top:10px"><div><label>কোড</label><input class="in" id="kc"></div><div><label>ধরন</label><select class="in" id="kt"><option value="pct">শতাংশ (%)</option><option value="flat">ফ্ল্যাট (৳)</option></select></div><div><label>পরিমাণ</label><input class="in" id="kv" type="number"></div><div><label>সর্বনিম্ন কেনাকাটা</label><input class="in" id="km" type="number" value="0"></div></div><button class="btn" onclick="ac()">কুপন যোগ করুন</button></div>`;
if(tab==="b")h+=`<div class="box"><h3 style="margin-top:0">ব্যাকআপ ও রিস্টোর</h3><button class="btn" onclick="dl()">পণ্যের ব্যাকআপ ডাউনলোড</button><p class="msg">পুরনো ব্যাকআপ ফাইল বা কপি করা JSON দিন:</p><input class="in" type="file" accept=".json,application/json" onchange="rf(this)"><textarea class="in" id="rj" rows="5" placeholder="অথবা JSON পেস্ট করুন"></textarea><button class="btn" onclick="rs()">রিস্টোর করুন</button><div class="msg" id="bm"></div></div>`;
if(tab==="t")h+=`<div class="box">${D.tickets.length?D.tickets.map(t=>`<div class="ord"><div class="bar"><b>#${t.id} · ${esc(t.name||t.email)}${t.rs?" · রিসেলার":""}</b><span class="badge ${t.status==="closed"?"s3":""}">${t.status==="closed"?"সমাধান":"চলমান"}</span></div><div class="msg">${esc(t.email)} · ${esc(t.phone||"")}${t.orderId?" · অর্ডার #"+t.orderId:""}</div><p>${esc(t.msg)}</p><input class="in" id="r${t.id}" value="${esc(t.reply)}" placeholder="উত্তর লিখুন"><button class="btn" onclick="rp(${t.id},'open')">উত্তর পাঠান</button> <button class="btn g" onclick="rp(${t.id},'closed')">উত্তর + সমাধান</button></div>`).join(""):"কোনো সাপোর্ট মেসেজ নেই।"}</div>`;
if(tab==="g"){const s=D.settings;h+=`<div class="box"><h3 style="margin-top:0">যোগাযোগ ও পলিসি</h3><label>সাপোর্ট ফোন</label><input class="in" id="g1" value="${esc(s.phone)}"><label>WhatsApp নম্বর</label><input class="in" id="g2" value="${esc(s.wa)}"><label>ইমেইল</label><input class="in" id="g3" value="${esc(s.email)}"><label>সময়সূচি</label><input class="in" id="g4" value="${esc(s.hours)}"><label>📲 বিকাশ পার্সোনাল/এজেন্ট নম্বর (Send Money)</label><input class="in" id="g7" value="${esc(s.bkash)}"><label>বিকাশে টাকা পাঠানোর নিয়ম (ফাঁকা রাখলে ডিফল্ট)</label><textarea class="in" id="g8" rows="4">${esc(s.bnote)}</textarea><div class="f2"><div><label>২টি পণ্যে কম্বো ছাড় (%)</label><input class="in" id="g9" type="number" value="${esc(s.c2||5)}"></div><div><label>৩+ পণ্যে কম্বো ছাড় (%)</label><input class="in" id="g10" type="number" value="${esc(s.c3||10)}"></div></div><label>অগ্রিম: ডেলিভারি চার্জের কত % আগে বিকাশে পাঠাতে হবে (০ দিলে বন্ধ, বিকাশ নম্বর না থাকলে চালু হবে না)</label><input class="in" id="g11" type="number" value="${esc(s.adv===undefined||s.adv===""?50:s.adv)}"><label>রিসেলারদের সর্বনিম্ন টাকা তোলার পরিমাণ (৳)</label><input class="in" id="g12" type="number" value="${esc(s.rsMin||500)}"><label>রিটার্ন ও ওয়ারেন্টি পলিসি</label><textarea class="in" id="g5" rows="5">${esc(s.ret)}</textarea><label>শর্তাবলি</label><textarea class="in" id="g6" rows="5">${esc(s.terms)}</textarea><button class="btn" onclick="sg()">সেভ</button><div class="msg" id="gm">ফাঁকা রাখলে ডিফল্ট লেখা দেখাবে</div></div>`}
if(tab==="r"){if(!RV&&D.products[0])RV=D.products[0].id;const cp=D.products.find(p=>p.id===RV)||{reviews:[]};h+=`<div class="box"><h3 style="margin-top:0">রিভিউ যোগ করুন</h3><p class="msg">⚠️ শুধু আসল ক্রেতার দেওয়া মতামত যোগ করুন (যেমন WhatsApp/Messenger-এ পাওয়া)। বানানো রিভিউ বা রেটিং যোগ করবেন না, এতে আইনি ও বিশ্বাসের ঝুঁকি আছে।</p><label>পণ্য</label><select class="in" onchange="RV=+this.value;render()">${D.products.map(p=>`<option value="${p.id}"${p.id===RV?" selected":""}>${esc(p.name)}</option>`).join("")}</select><label>ক্রেতার নাম</label><input class="in" id="rn"><label>রেটিং</label><select class="in" id="rs">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join("")}</select><label>রিভিউ</label><textarea class="in" id="rt" rows="3"></textarea><button class="btn" onclick="ar()">যোগ করুন</button><div class="msg" id="rm"></div></div><div class="box">${cp.reviews.length?cp.reviews.map(r=>`<div class="ord"><b>${esc(r.name)}</b> ${"★".repeat(r.rating)} ${r.ver?"(ভেরিফাইড ক্রেতা)":""}<div>${esc(r.text)}</div><button class="btn r" onclick="dr2(${RV},${r.id})">মুছুন</button></div>`).join(""):"এই পণ্যে কোনো রিভিউ নেই।"}</div>`}
if(tab==="n")h+=`<div class="box"><h3 style="margin-top:0">হোম ব্যানার (সর্বোচ্চ ৮টি)</h3><p class="msg">প্রস্তাবিত সাইজ ১২০০×৫০০ (ল্যান্ডস্কেপ)। ব্যানার না দিলে ডিফল্ট রঙিন স্লাইড দেখাবে।</p><label>ক্লিক করলে কোথায় যাবে (ঐচ্ছিক লিংক, যেমন পণ্যের শেয়ার লিংক)</label><input class="in" id="bl"><label>ব্যানারের ছবি বাছুন</label><input class="in" type="file" accept="image/*" onchange="pb(this)"><div class="msg" id="bm2"></div>${(D.banners||[]).map(b=>`<div class="ord"><img src="/ban/${b.id}" style="width:100%;border-radius:8px"><div class="msg">${esc(b.link)}</div><button class="btn r" onclick="db2(${b.id})">মুছুন</button></div>`).join("")}</div>`;
if(tab==="m"){const R=D.resellers||[],P2=D.payouts||[];h+=`<div class="box"><h3 style="margin-top:0">রিসেলার ও আবেদন</h3>${R.length?R.map(r=>`<div class="ord"><div class="bar"><b>${esc(r.shop||r.name)}</b><span class="badge ${r.status==="approved"?"s3":r.status==="blocked"?"s4":""}">${r.status==="approved"?"অনুমোদিত":r.status==="blocked"?"ব্লক":"আবেদন"}</span></div><div class="msg">${esc(r.email)} · ${esc(r.phone||"")} · বিকাশ ${esc(r.bkash||"")}</div>${r.status==="approved"?`<div>তোলার মতো ${bn(r.avail)} · অপেক্ষমাণ ${bn(r.pend)} · পরিশোধিত ${bn(r.paid)} · অনুরোধ ${bn(r.req)}</div>`:""}${r.status!=="approved"?`<button class="btn" onclick="rst('${esc(r.email)}','approved')">অনুমোদন</button> `:""}${r.status!=="blocked"?`<button class="btn r" onclick="rst('${esc(r.email)}','blocked')">ব্লক</button>`:""}</div>`).join(""):"কোনো রিসেলার নেই।"}</div><div class="box"><h3 style="margin-top:0">টাকা তোলার অনুরোধ</h3>${P2.length?P2.map(p=>`<div class="ord"><div class="bar"><b>${bn(p.amount)} · ${esc(p.name||p.email)}</b><span class="badge ${p.status==="paid"?"s3":p.status==="rejected"?"s4":""}">${p.status==="paid"?"পরিশোধিত":p.status==="rejected"?"বাতিল":"অপেক্ষমাণ"}</span></div><div class="msg">বিকাশ: ${esc(p.bkash)} · ${new Date(p.at).toLocaleDateString("bn-BD")}</div>${p.status==="pending"?`<button class="btn" onclick="pyo(${p.id},'paid')">বিকাশে পাঠিয়েছি, পরিশোধিত করুন</button> <button class="btn g" onclick="pyo(${p.id},'rejected')">বাতিল</button>`:""}</div>`).join(""):"কোনো অনুরোধ নেই।"}</div>`}
if(tab==="s")h+=`<div class="box"><h3 style="margin-top:0">Business Koro সিঙ্ক</h3><p>API Key সার্ভারের এনভায়রনমেন্টে থাকে, এখানে নয়।</p><button class="btn" onclick="sy()">পণ্য সিঙ্ক করুন</button><div class="msg" id="sm"></div></div>`;
$("app").innerHTML=h+"</div>"}
function pick(inp){[...inp.files].forEach(f=>{if(IMGS.length>=5)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{if(IMGS.length>=5)return;const s=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);IMGS.push(c.toDataURL("image/jpeg",.8));drawIms()};i.src=r.result};r.readAsDataURL(f)});inp.value=""}
function drawIms(){const e=$("ims");if(e)e.innerHTML=IMGS.map((u,i)=>`<span style="position:relative"><img src="${esc(u)}" width="64" height="64" style="object-fit:cover;border-radius:8px"><b onclick="IMGS.splice(${i},1);drawIms()" style="position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;cursor:pointer">×</b></span>`).join("")}
function sp(){const b={id:+$("pid").value||undefined,name:$("pn").value.trim(),cat:$("pc").value.trim()||"অন্যান্য",price:+$("pr").value,old:+$("po").value||+$("pr").value,stock:+$("ps").value||0,em:$("pe").value||"📦",desc:$("pd").value,imgs:IMGS,video:$("pv").value.trim(),type:$("pt").value,cost:+$("pk").value||0,rp:+$("pk2").value||0,featured:$("pf").checked};
 api("product","POST",b).then(()=>{IMGS=[];return load()}).catch(e=>$("pmsg").textContent=e.message)}
function ep(id){const p=D.products.find(x=>x.id===id);IMGS=[...p.imgs];$("ft").textContent="পণ্য এডিট";$("pid").value=id;$("pn").value=p.name;$("pc").value=p.cat;$("pr").value=p.price;$("po").value=p.old;$("ps").value=p.stock;$("pe").value=p.em;$("pd").value=p.desc||"";$("pv").value=p.video||"";$("pt").value=p.type;$("pk").value=p.cost||"";$("pk2").value=p.rp||"";$("pf").checked=!!p.featured;drawIms();scrollTo(0,0)}
function cpl(id){const u=location.origin+"/p/"+id;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert("শেয়ার লিংক কপি হয়েছে:\n"+u));else prompt("লিংক",u)}
function pd(id,v){api("order","POST",{id,paid:v}).then(load)}
function ar(){api("review","POST",{pid:RV,name:$("rn").value,rating:$("rs").value,text:$("rt").value}).then(load).catch(e=>$("rm").textContent=e.message)}
function dr2(pid,rid){if(confirm("মুছবেন?"))api("review","DELETE",{pid,rid}).then(load)}
function pb(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1200/i.width),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);api("banner","POST",{img:c.toDataURL("image/jpeg",.8),link:$("bl").value}).then(load).catch(e=>$("bm2").textContent=e.message)};i.src=r.result};r.readAsDataURL(f)}
function db2(id){if(confirm("মুছবেন?"))api("banner","DELETE",{id}).then(load)}
function dp(id){if(confirm("মুছবেন?"))api("product","DELETE",{id}).then(load)}
function os(id,status){api("order","POST",{id,status}).then(load)}
function cs(){return api("coupons","PUT",{coupons:D.coupons}).then(load)}
function tg(i){D.coupons[i].active=!D.coupons[i].active;cs()}function dc(i){D.coupons.splice(i,1);cs()}
function ac(){const c=$("kc").value.trim();if(!c||!+$("kv").value)return;D.coupons.push({code:c,type:$("kt").value,val:+$("kv").value,min:+$("km").value||0,active:true});cs()}
function sy(){$("sm").textContent="লোড হচ্ছে…";api("sync","POST").then(j=>{$("sm").textContent="✅ "+j.count+"টি পণ্য সিঙ্ক হয়েছে";load()}).catch(e=>$("sm").textContent="❌ "+e.message)}
function dl(){api("backup").then(d=>{const b=new Blob([JSON.stringify(d.products)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rdl-products-backup.json";a.click()})}
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("rj").value=r.result};r.readAsText(f)}
function rs(){let p;try{p=JSON.parse($("rj").value)}catch(e){$("bm").textContent="JSON ঠিক নেই";return}if(!Array.isArray(p)){$("bm").textContent="পণ্যের তালিকা (array) হতে হবে";return}api("restore","POST",{products:p}).then(j=>{$("bm").textContent="✅ "+j.count+"টি পণ্য রিস্টোর হয়েছে";return load()}).catch(e=>$("bm").textContent=e.message)}
function rp(id,s){api("ticket","POST",{id,reply:$("r"+id).value,status:s}).then(load)}
function sg(){api("settings","PUT",{phone:$("g1").value,wa:$("g2").value,email:$("g3").value,hours:$("g4").value,ret:$("g5").value,terms:$("g6").value,bkash:$("g7").value,bnote:$("g8").value,c2:$("g9").value,c3:$("g10").value,adv:$("g11").value,rsMin:$("g12").value}).then(()=>{$("gm").textContent="✅ সেভ হয়েছে"}).catch(e=>$("gm").textContent=e.message)}
function rst(email,status){api("reseller","POST",{email,status}).then(load)}
function pyo(id,status){if(confirm(status==="paid"?"আপনি কি বিকাশে টাকা পাঠিয়ে দিয়েছেন?":"অনুরোধ বাতিল করবেন?"))api("payout","POST",{id,status}).then(load)}
function dbt(){api("dbtest","POST").then(load)}
PW?load():login();
</script></body></html>
